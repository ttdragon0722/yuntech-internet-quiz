<text class="boxlbl" x="398.1" y="521.1" text-anchor="middle">R</text>
<text class="cap" x="478.0" y="646" text-anchor="middle">每台連到其他每一台（或一台以上）</text>
<text class="cap sub" x="478.0" y="668" text-anchor="middle">實務：路由器（R）串接</text>
<text class="cap" x="478.0" y="690" text-anchor="middle">路徑很多，路由器會自動選路</text>
<rect class="panel" x="640" y="384" width="300" height="356" rx="12"/>
