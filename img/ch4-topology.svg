<circle class="pc" cx="236.0" cy="598.0" r="12"/>
<line class="wire" x1="236.0" y1="532.0" x2="266.0" y2="598.0"/>
<circle class="pc" cx="266.0" cy="598.0" r="12"/>
<rect class="hub" x="138.0" y="458.0" width="56" height="24" rx="5"/>
<text class="boxlbl" x="166.0" y="474.0" text-anchor="middle">Switch</text>
<rect class="hub" x="74.0" y="520.0" width="44" height="24" rx="5"/>
<text class="boxlbl" x="96.0" y="536.0" text-anchor="middle">Hub</text>
<rect class="hub" x="214.0" y="520.0" width="44" height="24" rx="5"/>
<text class="boxlbl" x="236.0" y="536.0" text-anchor="middle">Hub</text>
<text class="cap" x="166.0" y="646" text-anchor="middle">一層接一層，像倒長的樹</text>
<text class="cap sub" x="166.0" y="668" text-anchor="middle">又稱「階層式網路」</text>
<text class="cap" x="166.0" y="690" text-anchor="middle">實務：集線器、交換器串接</text>
<rect class="panel" x="328" y="384" width="300" height="356" rx="12"/>
<text class="title" x="478.0" y="418" text-anchor="middle">網狀（Mesh）</text>
