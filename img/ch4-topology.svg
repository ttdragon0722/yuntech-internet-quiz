<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 756" width="956" height="756" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
<title>網路拓樸示意圖</title>
<style>
 .bg{fill:#fff} .panel{fill:#f6f5f1;stroke:#e0ddd5} .title{fill:#1d232b;font-size:19px;font-weight:700}
 .cap{fill:#1d232b;font-size:13.5px} .cap.sub{fill:#5f6873} .note{fill:#5f6873;font-size:11.5px}
 .pc{fill:#1f5f8b} .hub{fill:#3c4652} .router{fill:#9a5b13} .boxlbl{fill:#fff;font-size:11.5px;font-weight:700}
 .wire{stroke:#8b96a3;stroke-width:2} .trunk{stroke:#3c4652;stroke-width:4;fill:none} .term{fill:#b3372f}
 .flow{stroke:#b3372f;stroke-width:2;fill:none} .ah{fill:#b3372f}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#15181c} .panel{fill:#1e2227;stroke:#30363d} .title,.cap{fill:#e8e6e1} .cap.sub,.note{fill:#9aa3ad}
  .pc{fill:#4f95c6} .hub{fill:#6b7682} .router{fill:#c98a3e} .wire{stroke:#5c6670} .trunk{stroke:#9aa3ad}
  .term,.ah{fill:#e06a60} .flow{stroke:#e06a60}
 }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
