<rect class="router" x="543.9" y="505.1" width="28" height="24" rx="5"/>
<text class="boxlbl" x="557.9" y="521.1" text-anchor="middle">R</text>
<rect class="router" x="513.4" y="587.9" width="28" height="24" rx="5"/>
