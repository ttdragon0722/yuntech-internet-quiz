<circle class="pc" cx="214.0" cy="220.0" r="12"/>
<line class="wire" x1="262.0" y1="168.0" x2="262.0" y2="116.0"/>
<circle class="pc" cx="262.0" cy="116.0" r="12"/>
<text class="note" x="294.0" y="192" text-anchor="end">終端器</text>
<text class="cap" x="166.0" y="278" text-anchor="middle">所有電腦接在一條電纜上</text>
<text class="cap sub" x="166.0" y="300" text-anchor="middle">例：10Base2、10Base5、802.4</text>
<text class="cap" x="166.0" y="322" text-anchor="middle">✓ 不用買集線器；一台壞不影響</text>
<text class="cap" x="166.0" y="344" text-anchor="middle">✗ 纜線一斷全網中斷；會碰撞</text>
<rect class="panel" x="328" y="16" width="300" height="356" rx="12"/>
<text class="title" x="478.0" y="50" text-anchor="middle">星狀（Star）</text>
<line class="wire" x1="478.0" y1="168.0" x2="478.0" y2="96.0"/>
<circle class="pc" cx="478.0" cy="96.0" r="12"/>
<line class="wire" x1="478.0" y1="168.0" x2="554.2" y2="132.0"/>
<circle class="pc" cx="554.2" cy="132.0" r="12"/>
