<text class="title" x="166.0" y="50" text-anchor="middle">匯流排（Bus）</text>
<line class="trunk" x1="46.0" y1="168.0" x2="286.0" y2="168.0"/>
<rect class="term" x="38.0" y="159" width="8" height="18" rx="2"/>
