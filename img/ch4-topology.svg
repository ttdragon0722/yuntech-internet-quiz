<circle class="pc" cx="401.8" cy="132.0" r="12"/>
<rect class="hub" x="456.0" y="156.0" width="44" height="24" rx="5"/>
<text class="boxlbl" x="478.0" y="172.0" text-anchor="middle">Hub</text>
<text class="cap" x="478.0" y="278" text-anchor="middle">又稱放射狀，全接到集線器</text>
<text class="cap sub" x="478.0" y="300" text-anchor="middle">例：乙太網路｜⭐ 小型 LAN 最常見</text>
<text class="cap" x="478.0" y="322" text-anchor="middle">✓ 佈線、檢修容易；斷線只影響一台</text>
<text class="cap" x="478.0" y="344" text-anchor="middle">✗ 集線器壞全網癱瘓；會碰撞</text>
<rect class="panel" x="640" y="16" width="300" height="356" rx="12"/>
<text class="title" x="790.0" y="50" text-anchor="middle">環狀（Ring）</text>
<ellipse class="trunk" cx="790.0" cy="168" rx="86" ry="70" fill="none"/>
<circle class="pc" cx="790.0" cy="98.0" r="12"/>
<circle class="pc" cx="864.5" cy="133.0" r="12"/>
<circle class="pc" cx="864.5" cy="203.0" r="12"/>
<circle class="pc" cx="790.0" cy="238.0" r="12"/>
<circle class="pc" cx="715.5" cy="203.0" r="12"/>
<circle class="pc" cx="715.5" cy="133.0" r="12"/>
<path class="flow" d="M 760.0 128 A 50 40 0 0 1 820.0 128" marker-end="url(#ah)"/>
<text class="note" x="790.0" y="173" text-anchor="middle">記號依序傳遞</text>
<text class="cap" x="790.0" y="278" text-anchor="middle">主幹線形成環狀迴路</text>
<text class="cap sub" x="790.0" y="300" text-anchor="middle">例：IEEE 802.5 Token Ring</text>
<text class="cap" x="790.0" y="322" text-anchor="middle">✓ 不會碰撞；可用橋接器擴大</text>
<text class="cap" x="790.0" y="344" text-anchor="middle">✗ 電纜斷裂網路損毀｜實務接 MAU</text>
<rect class="panel" x="16" y="384" width="300" height="356" rx="12"/>
<text class="title" x="166.0" y="418" text-anchor="middle">樹狀（Tree）</text>
