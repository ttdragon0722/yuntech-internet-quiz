<text class="note" x="790.0" y="468" text-anchor="middle">匯流排主幹</text>
<text class="cap" x="790.0" y="646" text-anchor="middle">結合匯流排、星狀、環狀</text>
<text class="cap sub" x="790.0" y="668" text-anchor="middle">例：星狀匯流排（本圖）、星狀環</text>
<text class="cap" x="790.0" y="690" text-anchor="middle">實務上：樹狀 ＋ 網狀</text>
